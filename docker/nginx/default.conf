server {
    listen 80;
    server_name watermelon.helmy.my.id;

    # Laravel API lives under /api — served from public/ (Laravel's own front controller).
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 32M;

    # SPA static assets (built Vue app) take priority for everything that isn't /api.
    location / {
        root /var/www/html/public-spa;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www/html/public-spa;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
